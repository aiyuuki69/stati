<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>StatiCrypt Bruteforcer</title>
    <style>
        body { font-family: sans-serif; margin: 30px; background: #1e1e1e; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; background: #2d2d2d; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #bbb; }
        input[type="file"] { background: #3a3a3a; padding: 10px; border-radius: 4px; border: 1px solid #555; width: 93%; color: #fff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #logView { margin-top: 20px; height: 350px; overflow-y: auto; background: #000; padding: 15px; font-family: 'Courier New', monospace; border-radius: 4px; border: 1px solid #444; line-height: 1.6; }
        .fail { color: #ff4d4d; }
        .skip { color: #888888; font-style: italic; }
        .success { color: #2bed6b; font-weight: bold; font-size: 1.4em; display: block; border: 3px solid #2bed6b; padding: 15px; margin: 15px 0; background: rgba(43, 237, 107, 0.1); text-align: center; box-shadow: 0 0 15px rgba(43, 237, 107, 0.3); }
    </style>
</head>
<body>
<div class="container">
    <h2>StatiCrypt 自動解析パネル</h2>
    <div class="form-group">
        <label>対象のStatiCrypt HTMLファイルを選択してください:</label>
        <input type="file" id="targetFile" accept=".html">
    </div>
    <button id="startBtn">自動総当たりを実行</button>

    <h3>結果プレビュー</h3>
    <div id="logView">ファイルを指定してボタンを押してください。</div>
</div>

<script>
// 📝 ここに試したいパスワードの候補を自由に並べてください
const passwordList = [
    "1234",
    "password",
    "cheat",
    "patch",
    "keyskip",
    "vip",
    "free",
    "ywp"
    // 必要に応じて後ろにカンマ区切りで追加してください
];

document.getElementById('startBtn').addEventListener('click', async () => {
    const targetFile = document.getElementById('targetFile').files[0];
    const logView = document.getElementById('logView');
    
    if(!targetFile) {
        alert("HTMLファイルを選択してください。");
        return;
    }

    logView.innerHTML = "[*] 内蔵辞書による自動解析を開始しました...<br>";
    logView.innerHTML += `[*] 総候補数: ${passwordList.length} 件<br>----------------------------------<br>`;

    const htmlText = await targetFile.text();

    // パスワードの配列を1件ずつ順番に送信処理
    for(let password of passwordList) {
        const formData = new FormData();
        formData.append("html_content", htmlText);
        formData.append("password", password);

        try {
            const res = await fetch('/decrypt', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.status === "success") {
                // 成功時は緑色の大きな目立つ枠を表示し、ループを即時停止
                logView.innerHTML += `<div class="success">【結果のパスワード 成功】<br>正解パスワード：${password}</div>`;
                logView.scrollTop = logView.scrollHeight;
                break; 
            } else if (data.status === "skipped") {
                // 過去にテスト済みの場合はグレー色でスキップ通知
                logView.innerHTML += `<span class="skip">${password} ➡️ 過去に試行済みのためスキップ</span><br>`;
                logView.scrollTop = logView.scrollHeight;
            } else if (data.status === "error") {
                logView.innerHTML += `<span class="fail">[エラー] ${data.message}</span><br>`;
                break;
            } else {
                // 失敗時は指定通り赤文字で「失敗」を出力
                logView.innerHTML += `<span class="fail">${password} 失敗(赤色の文字)</span><br>`;
                logView.scrollTop = logView.scrollHeight;
            }
        } catch (e) {
            logView.innerHTML += `<span class="fail">[通信エラー] ${password} の通信に失敗しました。</span><br>`;
        }
    }
});
</script>
</body>
</html>
